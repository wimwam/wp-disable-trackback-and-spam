name: Build Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v6

      - name: Build plugin ZIP
        run: |
          mkdir wp-disable-trackback-and-spam

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='wp-disable-trackback-and-spam' \
            ./ wp-disable-trackback-and-spam/

          zip -r \
            "wp-disable-trackback-and-spam-${{ github.event.release.tag_name }}.zip" \
            wp-disable-trackback-and-spam

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: wp-disable-trackback-and-spam-${{ github.event.release.tag_name }}.zip
